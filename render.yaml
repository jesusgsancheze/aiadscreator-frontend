services:
  - type: web
    name: aiadscreator-frontend
    runtime: static
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      # Full origin + /api path of the backend service,
      # e.g. "https://aiadscreator-backend.onrender.com/api".
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback — all unknown paths return index.html so react-router handles them.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Immutable fingerprinted assets — cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Never cache the entry HTML so users get new asset hashes on deploy.
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
